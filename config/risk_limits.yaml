# 리스크 한도
# - 아래 값은 초기 기본값이다. 실제 운영 전에 사람이 검토해서 확정한다
# - 코드가 이 값을 요청 없이 완화하거나 우회하지 않는다
# - 비율은 소수로 쓴다 (0.01 = 1%)

# 계좌 단위 한도
daily_loss_limit_rate: 0.01      # 일일 손실이 운용자금 대비 이 비율에 닿으면 당일 거래 중단
max_trades_per_day: 3            # 일일 최대 진입 횟수 (README 2절: 하루 0~3회)
max_consecutive_losses: 2        # 연속 손실 횟수가 이 값에 닿으면 당일 거래 중단

# 포트폴리오 계층 (N종목 확장 대비)
max_concurrent_positions: 1      # 동시 보유 종목 수 상한 (1단계는 1)
max_weight_per_symbol: 1.0       # 종목당 운용자금 비중 상한
max_weight_per_sector: 1.0       # 같은 업종 비중 상한

# 당일 청산
force_close_time: "15:15"        # KST. 이 시각 이후 보유 포지션 강제 청산

# 긴급 정지 (kill switch)
# - 데이터 루트 아래 이 파일이 존재하면 신규 주문을 멈추고 청산 절차로 들어간다
kill_switch_file: KILL_SWITCH
