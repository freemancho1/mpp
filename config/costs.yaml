# 비용 모델
# - 비율은 소수로 쓴다 (0.002 = 0.20%)
# - 백테스트·라벨 손익 판정은 모두 이 값을 쓴다
# - 세율·수수료·호가단위는 바뀔 수 있으므로 적용 전에 최신 기준을 확인한다

# 매도 시 거래세 (2026년 기준, 코스피·코스닥 동일 0.20%)
sell_tax_rate: 0.0020

# 증권사 수수료율 (매수·매도 각각, 편도)
# TODO: KIS 계좌 개설 후 실제 적용 수수료율로 확인·수정
commission_rate: 0.00015

# 슬리피지 가정 (편도, 호가단위 틱 수)
slippage_ticks: 1

# 가격제한폭 (전일 종가 대비 상·하한 비율)
price_limit_rate: 0.30

# 호가단위 표 (KRX 유가·코스닥 공통, 2023-01-25 개편 기준)
# - 가격이 below 미만인 구간에 tick 적용. 마지막 구간은 below: null (상한 없음)
# - 주문 가격은 반드시 호가단위 배수로 맞춘다
tick_size_table:
  - { below: 2000, tick: 1 }
  - { below: 5000, tick: 5 }
  - { below: 20000, tick: 10 }
  - { below: 50000, tick: 50 }
  - { below: 200000, tick: 100 }
  - { below: 500000, tick: 500 }
  - { below: null, tick: 1000 }
